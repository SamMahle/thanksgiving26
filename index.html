const dur = m => { m = Math.max(0,Math.ceil(m)); return m < 60 ? m+' min' : Math.floor(m/60)+' hr '+(m%60?pad(m%60)+' min':''); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eff = i => STEPS[i].t + state.shifts.filter(s => s.from <= i).reduce((a,s) => a + s.mins, 0);
const ovenAt = i => { for(let k=i;k>=0;k--) if(STEPS[k].oven!==null) return STEPS[k].oven; return null; };
const ovenTxt = v => v === null ? '—' : v === 0 ? 'Off' : v+'°';
const delay = () => state.shifts.reduce((a,s)=>a+s.mins,0);

function nowMin(){ if(test) return testMin; const d = new Date(); return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; }
function dayPhase(){ if(test) return 'on'; const d = new Date(); const k = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); return k < DAY ? 'before' : k > DAY ? 'after' : 'on'; }

function slots(now){
  const idx = STEPS.map((s,i)=>i);
  const past = idx.filter(i => eff(i) <= now);
  const fut = idx.filter(i => eff(i) > now);
  const curT = past.length ? Math.max(...past.map(eff)) : null;
  const nxtT = fut.length ? Math.min(...fut.map(eff)) : null;
  return { cur: curT===null ? [] : past.filter(i => eff(i)===curT), next: nxtT===null ? [] : fut.filter(i => eff(i)===nxtT), curT, nxtT };
}

function tags(s){
  const t = s.who.map(w => `<span class="tag ${w}">${WHO[w]}</span>`);
  if(s.stove) t.push('<span class="tag ST">Stove</span>');
  return t.length ? `<div class="tags">${t.join('')}</div>` : '';
}

function dial(v){
  const deg = v ? -135 + Math.min(v,450)/450*270 : -135;
  let ticks = '';
  for(let k=0;k<=9;k++){ const a=(-135+k*30)*Math.PI/180; const r1=78,r2=k%2?84:90; ticks+=`<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}" stroke="currentColor" stroke-width="${k%2?2:3}" opacity=".5"/>`; }
  return `<svg viewBox="0 0 200 200" aria-hidden="true" style="color:var(--soft)">
<circle cx="100" cy="100" r="96" fill="var(--accbg)"/>${ticks}
<circle cx="100" cy="100" r="62" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
<g class="needle" style="transform-origin:100px 100px;transform:rotate(${deg}deg)"><rect x="96" y="40" width="8" height="46" rx="4" fill="var(--acc)"/></g>
<circle cx="100" cy="100" r="10" fill="var(--acc)"/></svg>`;
}

function ovenDir(a,b){ const x = a===null?0:a, y = b===null?0:b; return y > x ? 'up' : y < x ? 'down' : null; }
function ovenChangeAt(i){ const prev = i>0 ? ovenAt(i-1) : 0; const v = ovenAt(i); const d = ovenDir(prev, v); return d ? {dir:d, v, from:prev||0} : null; }
function alertTxt(c){ return c.v===0 ? 'Turn the oven off' : (c.dir==='up' ? (c.from===0?'Preheat the oven to ':'Raise the oven to ') : 'Lower the oven to ') + c.v + '°F'; }

function ring(p){ const r=20, C=2*Math.PI*r, f=Math.max(0,Math.min(1,p)); return `<svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="24" cy="24" r="${r}" fill="none" stroke="var(--acc)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 24 24)"/></svg>`; }

function timeline(now, on){
  const a = eff(0), z = eff(STEPS.length-1), pct = t => Math.max(0,Math.min(100,(t-a)/(z-a)*100));
  const ticks = STEPS.map((s,i) => `<i class="${state.done[i]?'d':''}" style="left:${pct(eff(i)).toFixed(2)}%"></i>`).join('');
  const hrs = [480,600,720,840,960].map(h => `<span class="h" style="left:${pct(h).toFixed(2)}%">${(Math.floor(h/60)%12||12)}${h<720?' AM':' PM'}</span>`).join('');
  const me = on && now >= a && now <= z ? `<div class="me" style="left:${pct(now).toFixed(2)}%"></div>` : '';
  return `<div class="tl" aria-hidden="true"><div class="bar"></div>${on?`<div class="fill" style="width:${pct(now).toFixed(2)}%"></div>`:''}${ticks}${me}${hrs}</div>`;
}

function nowRight(v, clock){ return `<span class="nr"><span class="clock" aria-label="Current time">${clock}</span>${badge(v)}</span>`; }
function ago(m){ m = Math.floor(m); return m < 1 ? 'just now' : m < 60 ? m+' min ago' : Math.floor(m/60)+' hr '+(m%60? (m%60)+' min ':'')+'ago'; }
function badge(v){ return `<span class="badge ${v?'':'off'}" title="Oven setting">${dial(v)}<span><small>Oven</small>${v?v+'°F':'Off'}</span></span>`; }


function nextPanel(ringHtml, idxs, at, cd, soon){
  const first = idxs[0];
  const tasks = idxs.map((i,k) => `<div class="ntask ${k?'sub':''} ${state.done[i]?'done':''}"><p>${esc(STEPS[i].task)}</p>${tags(STEPS[i]).replace('class="tags"','class="tags nt-tags"')}</div>`).join('');
  return `<div class="nextp" data-k="${first}"><div class="nhead"><span class="nh">${ringHtml}${ico(first,'sm')}<span class="lbl">Next · ${at}</span><b class="cd">${cd}</b></span>${soon}</div>${tasks}</div>`;
}
let lastKey = null;
const fx = document.createElement('div'); fx.id = 'fx'; document.body.appendChild(fx);

function render(){
  if(panel){ fx.className=''; return renderList(); }
  const now = nowMin(), ph = dayPhase(), {cur,next,curT,nxtT} = slots(now);
  const dinnerT = eff(STEPS.length-1), d = delay();
  const clock = fmt(now);
  const status = sync === 'off' ? 'Not set up · this screen only' : live ? 'Live' : sync === 'connecting' ? 'Connecting…' : 'Offline · not syncing';
  const head = `<div class="top"><span><b>Thanksgiving</b> · Thursday, Nov 26</span><span style="display:flex;gap:8px;flex-wrap:wrap">${d?`<span class="pill">Running ${d} min late</span>`:''}<span class="pill">${now<dinnerT||ph!=='on'?'Dinner '+fmt(dinnerT)+(ph==='on'?' · in '+dur(dinnerT-now):''):'Dinner is served'}</span><span class="pill q">${status}</span></span></div>`;
  let body, effect = '', key = 'x';
  if(ph==='after' || (ph==='on' && now >= dinnerT)){
    key = 'dinner';
    body = `<div class="now"><div class="nhead"><span class="nh">${ico(STEPS.length-1,"tile")}<span class="lbl"><span class="nowk">Now</span>Started ${fmt(dinnerT)}</span></span><span class="clock" aria-label="Current time">${clock}</span>${badge(ovenAt(STEPS.length-1))}</div><div class="task"><p class="big">Dinner is served. Happy Thanksgiving.</p></div></div>`;
  } else if(ph==='before' || !cur.length){
    key = 'pre';
    body = `<div class="now"><div class="nhead"><span class="nh">${ico(0,'tile')}<span class="lbl">${ph==='before'?'Starts Thursday at '+fmt(eff(0)):'Starts at '+fmt(eff(0))}</span></span><span class="clock" aria-label="Current time">${clock}</span>${badge(0)}</div><div class="task"><p>${esc(STEPS[0].task)}</p></div><div><button data-act="test" style="min-height:48px;padding:0 18px;border-radius:12px;border:2px dashed var(--acc);background:none;color:var(--acc);font-weight:700;font-size:16px">Try a test run</button></div></div>
`+nextPanel('', [0], fmt(eff(0)), ph==='on'?'in '+dur(eff(0)-now):'Thursday', `<span class="soon up">Preheat to 325°F</span>`);
  } else {
    key = 'c'+cur[0];
    const lastI = cur[cur.length-1], v = ovenAt(lastI);
    const chg = cur.map(ovenChangeAt).find(Boolean);
    const chgOpen = chg && !cur.every(i => state.done[i]);
    if(chgOpen) effect = chg.dir==='up' ? 'fire' : 'frost';
    const al = chgOpen ? `<div class="alert ${chg.dir}"><div>${alertTxt(chg)}<small>${chg.dir==='up'?'Oven heating up':'Oven cooling down'}</small></div></div>` : '';
    const nowHtml = cur.map((i,k) => `<div class="task ${k?'sub':''} ${state.done[i]?'done':''}"><button class="chk" data-act="tog" data-i="${i}" aria-label="Mark done">${state.done[i]?'✓':''}</button><p>${esc(STEPS[i].task)}</p></div>${tags(STEPS[i])}`).join('');
    let nx = '';
    if(next.length){
      const nc = next.map(ovenChangeAt).find(Boolean);
      const soon = nc ? `<span class="soon ${nc.dir}">${nc.v===0?'Turn oven off':(nc.dir==='up'?(nc.from===0?'Preheat to ':'Raise to '):'Lower to ')+nc.v+'°F'}</span>` : '';
      nx = nextPanel(ring((now-curT)/(nxtT-curT)), next, fmt(nxtT), 'in '+dur(nxtT-now), soon);
    }
    body = `<div class="now"><div class="nhead"><span class="nh">${ico(cur[0],"tile")}<span class="lbl"><span class="nowk">Now</span>Started ${fmt(eff(cur[0]))} · ${ago(now-eff(cur[0]))}</span></span><span class="clock" aria-label="Current time">${clock}</span>${badge(v)}</div>${al}${nowHtml}</div>${nx}`;
  }
  const acts = `<div class="acts"><button class="pri" data-act="done">Done</button><button data-act="late">Running late +15</button><button data-act="list">Full list</button></div>`;
  app.innerHTML = head + body + timeline(now, ph==='on') + acts + (test ? testBar() : '');
  if(lastKey !== null && key !== lastKey){ const n = app.querySelector('.now'); if(n) n.classList.add('pulse'); const np = app.querySelector('.nextp'); if(np) np.classList.add('enter'); }
  lastKey = key;
  fx.className = effect;
  keepTest();
}

function testBar(){
  return `<div class="tbar"><b>Test mode · ${fmt(testMin)}</b><input type="range" min="420" max="1000" step="1" value="${Math.round(testMin)}" data-act="slide" aria-label="Test time"><button data-act="play">${play?'Pause':'Play fast'}</button><button data-act="exit">Exit test</button></div>`;
}

function renderList(){
  keepTest();
  const now = nowMin(), cur = dayPhase()==='on' ? slots(now).cur : [];
  const rows = STEPS.map((s,i) => {
    const sh = eff(i) - s.t;
    return `<div class="row ${cur.includes(i)?'cur':''} ${state.done[i]?'done':''}"><span class="tm">${fmt(eff(i))}${sh?`<s>was ${fmt(s.t)}</s>`:''}</span><button class="chk" data-act="tog" data-i="${i}" aria-label="Mark done">${state.done[i]?'✓':''}</button><span class="tx"><span class="tl1">${ico(i,"xs")}<span>${esc(s.task)}</span></span>${s.who.length||s.stove?`<span style="display:flex;gap:6px;flex-wrap:wrap">${s.who.map(w=>`<span class="tag ${w}">${WHO[w]}</span>`).join('')}${s.stove?'<span class="tag ST">Stove</span>':''}</span>`:''}</span><span class="ov">${s.stove?'Stove':ovenTxt(ovenAt(i))}</span></div>`;
  }).join('');
  app.innerHTML = `<div class="sheet"><div class="shead"><h2>Thursday, Nov 26</h2><span style="display:flex;gap:8px;flex-wrap:wrap"><button data-act="test">${test?'Exit test':'Test mode'}</button>${delay()?'<button data-act="early">Undo 15 min</button>':''}<button data-act="reset">Reset</button><button data-act="close">Back</button></span></div>${rows}
<p class="note">Times are estimates. Go by the thermometer: 165°F in the turkey and 140°F in the ham. If the turkey finishes early, keep it tented with foil. Rolls at 4:10 come from the 4:20 step on the printed sheet. Reset clears every checkmark and delay.</p>${test?testBar():''}</div>`;
}

let confirmReset = false;
function save(){
  try{ localStorage.setItem('tg-state', JSON.stringify(state)); }catch(e){}
  if(db) db.set(state).catch(() => {});
}

function upcomingIndex(){ const {next} = slots(nowMin()); return next.length ? next[0] : null; }

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').catch(()=>{}); }catch(err){}
  if(a==='tog'){ const i = +b.dataset.i; if(state.done[i]) delete state.done[i]; else state.done[i] = true; save(); }
  else if(a==='done'){ const {cur} = slots(nowMin()); cur.forEach(i => state.done[i] = true); save(); }
  else if(a==='late'){ const i = upcomingIndex(); if(i!==null){ state.shifts.push({from:i, mins:15}); save(); } }
  else if(a==='early'){ const i = upcomingIndex(); state.shifts.push({from: i===null?0:i, mins:-15}); if(delay()<0) state.shifts.pop(); save(); }
  else if(a==='list'){ panel = true; }
  else if(a==='close'){ panel = false; confirmReset = false; }
  else if(a==='reset'){ if(!confirmReset){ confirmReset = true; b.textContent = 'Tap again to reset'; return; } state = {done:{},shifts:[]}; confirmReset = false; save(); }
  else if(a==='test'){ test = !test; play = false; if(test) panel = false; }
  else if(a==='exit'){ test = false; play = false; }
  else if(a==='play'){ play = !play; }
  else return;
  render();
});
app.addEventListener('input', e => { if(e.target.dataset.act==='slide'){ testMin = +e.target.value; play = false; const lb = e.target.parentNode.querySelector('b'); if(lb) lb.textContent = 'Test mode · ' + fmt(testMin); } });
app.addEventListener('change', e => { if(e.target.dataset.act==='slide'){ testMin = +e.target.value; render(); } });

setInterval(() => { if(test && play){ testMin += 1; if(testMin > 1000) play = false; render(); } }, 1000);
setInterval(() => { if(!test && !panel) render(); }, 15000);

render();

// Live sync: Firebase Realtime Database at /thanksgiving/state. Last write wins.
(function connect(){
  const ok = window.firebase && firebase.database && FIREBASE_CONFIG.databaseURL.indexOf('PASTE_') < 0;
  if(!ok){
    sync = window.firebase ? 'off' : 'offline'; render();
    // SDK failed to load (no network at page load): reload once the connection is back
    if(!window.firebase) window.addEventListener('online', () => { try{ location.reload(); }catch(e){} });
    return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const rdb = firebase.database();
    db = rdb.ref('thanksgiving/state');
    db.on('value', snap => {
      state = normalize(snap.val());
      try{ localStorage.setItem('tg-state', JSON.stringify(state)); }catch(e){}
      render();
    }, () => { sync = 'offline'; render(); });
    rdb.ref('.info/connected').on('value', snap => { live = snap.val() === true; if(live) sync = 'online'; render(); });
    setTimeout(() => { if(sync === 'connecting'){ sync = 'offline'; render(); } }, 6000);
  }catch(e){ db = null; sync = 'offline'; render(); }
})();
}
</script></body></html>
